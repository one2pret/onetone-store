name: PR TypeScript and Unit Tests

on:
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Typecheck and checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:run

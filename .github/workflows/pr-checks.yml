name: PR TypeScript and Unit Tests

on:
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Typecheck and checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing package-lock.json is not synchronized with package.json.
      # Match Dockerfile's npm install until a separate lockfile repair PR.
      # Do not use npm ci here before that repair (it fails before tests).
      - name: Install dependencies (matching Dockerfile)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:run

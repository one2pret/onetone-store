name: PR TypeScript and Unit Tests

on:
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Typecheck and checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing package-lock.json is not synchronized with package.json.
      # Match Dockerfile's npm install until a separate lockfile repair PR.
      # Do not use npm ci here before that repair (it fails before tests).
      - name: Install dependencies (matching Dockerfile)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:run
      - name: Sandbox reservation MySQL tests
        env:
          SANDBOX_BOOKING_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/sbx_booking_test
        run: npx vitest run tests/integration/sandbox-booking.test.ts
